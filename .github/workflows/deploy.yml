name: CD Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  validate:
    name: Validate Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm lint

      - name: Run TypeScript Strict Check
        run: pnpm typecheck

      - name: Run Test Suites
        run: pnpm test

      - name: Build Monorepo
        run: pnpm build

  deploy-prod:
    name: Deploy to Cloud Run (asia-south1)
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Production Migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: pnpm --filter @campusedge/database exec prisma migrate deploy

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy campusedge-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/campusedge-api:latest \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy campusedge-web \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/campusedge-web:latest \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated

      - name: Run Production Smoke Verification
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          WEB_URL: ${{ secrets.PROD_WEB_URL }}
          TARGET_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        run: npx tsx scripts/production-smoke-test.ts
